apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      # securityContext:
      #   fsGroup: 33
      #   runAsUser: 33
      #   runAsGroup: 33
      containers:
        - name: audiobookshelf
          image: advplyr/audiobookshelf:2.37.0
          ports:
            - containerPort: 3005
          # ports:
          # - containerPort: 80
          envFrom:
            - configMapRef:
                name: audiobookshelf-ports
          volumeMounts:
            - name: audiobookshelf-data
              mountPath: /etc/audiobookshelf/data/config
              subpath: config
            - name: audiobookshelf-data
              mountPath: /etc/audiobookshelf/data/metadata
              subpath: metadata
            - name: audiobookshelf-data
              mountPath: /etc/audiobookshelf/data/audiobooks
              subpath: audiobooks
            - name: audiobookshelf-data
              mountPath: /etc/audiobookshelf/data/podcasts
              subpath: podcasts
      volumes:
        - name: audiobookshelf-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
      #     securityContext:
      #       allowPrivilegeEscalation: false
      #     envFrom:
      #       - secretRef:
      #           name: audiobookshelf-container-env
