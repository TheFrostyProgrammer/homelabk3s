apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      # securityContext:
      #   fsGroup: 33
      #   runAsUser: 33
      #   runAsGroup: 33
      containers:
        - name: audiobookshelf
          image: advplyr/audiobookshelf:2.37.0
          ports:
            - containerPort: 3005
          # ports:
          # - containerPort: 80
          envFrom:
            - configMapRef:
                name: audiobookshelf-ports
