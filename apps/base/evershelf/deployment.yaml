apiVersion: apps/v1
kind: Deployment
metadata:
  name: evershelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evershelf
  template:
    metadata:
      labels:
        app: evershelf
    spec:
      securityContext:
        # runAsNonRoot: true
        # fsGroup: 1000
        # runAsUser: 1000
        # runAsGroup: 1000
      containers:
        - name: evershelf
          image: ghcr.io/dadaloop82/evershelf:2.2.11
          ports:
            - containerPort: 8080
          # ports:
          # - containerPort: 80
          envFrom:
            - configMapRef:
                name: evershelf-env
